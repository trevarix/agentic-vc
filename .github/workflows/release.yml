name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write       # create GitHub releases and upload assets
  id-token: write       # required for cosign keyless signing via OIDC

jobs:
  release:
    name: Build, sign, and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # goreleaser needs full git history for changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: avc/go.mod
          cache-dependency-path: avc/go.sum

      - name: Run tests
        working-directory: avc
        env:
          CGO_ENABLED: "0"
        run: go test ./... -count=1 -timeout=120s

      # cosign is used by goreleaser to sign the checksums file against the
      # GitHub OIDC token — no stored certificates or secrets required.
      # Users can verify with: cosign verify-blob --certificate <file>.pem \
      #   --signature <file>.sig checksums.txt
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Extract changelog section for release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^## \[$VERSION\]/{f=1;next} f && /^## /{f=0} f" CHANGELOG.md > .goreleaser-release-notes.md
          echo "--- Release notes preview ---"
          cat .goreleaser-release-notes.md

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained PATs with "Contents: write" on the tap/bucket repos.
          # Create at: Settings → Developer settings → Personal access tokens (fine-grained)
          # Set in: Repository secrets → HOMEBREW_TAP_TOKEN, SCOOP_BUCKET_TOKEN
          # Leave unset to skip tap/bucket updates (releases still work).
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

      # goreleaser sets the release body to the footer only (changelog.disable: true).
      # Prepend the extracted changelog section so the full notes read: changelog + install.
      - name: Prepend changelog to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body -q .body)
          { cat .goreleaser-release-notes.md; echo; echo "$existing"; } > /tmp/release-body.md
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/release-body.md

  # Claude Desktop extension bundles. Desktop chat cannot run a plugin's MCP
  # server — plugins contribute skills there and nothing else — so a .mcpb
  # bundle is the only way Desktop users get the avc_* tools.
  desktop-extension:
    name: Build and attach Claude Desktop bundles
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: avc/go.mod
          cache-dependency-path: avc/go.sum

      - name: Build .mcpb bundles
        run: python3 scripts/build-mcpb.py "${GITHUB_REF_NAME}" dist/mcpb

      - name: Upload bundles to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/mcpb/*.mcpb \
            --repo "$GITHUB_REPOSITORY" --clobber

  # Move plugin users to this release by pinning the marketplace at it. The
  # marketplace lives in another repository, so nothing here can notice when
  # its pin goes stale — hence automation rather than a checklist entry.
  #
  # Two gates, because this is the one step that reaches existing users
  # without them asking:
  #
  #   1. Prereleases are skipped. goreleaser's `prerelease: auto` treats any
  #      hyphenated tag as a prerelease, so `v0.5.0-rc1` publishes binaries
  #      and bundles for you to install and try while leaving every existing
  #      plugin user where they are.
  #   2. The `marketplace` environment requires a reviewer. Only this job
  #      waits — the release, its binaries, and the bundles are already
  #      published, so a pending approval never blocks a download.
  #
  # If it does go wrong, re-pinning is a one-line revert that reaches users on
  # their next marketplace update. Unlike a published binary, this is undoable.
  pin-marketplace:
    name: Pin marketplace to this release
    needs: [release, desktop-extension]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@v4

      - name: Pin the plugin ref
        env:
          # Fine-grained PAT with "Contents: write" on trevarix/claude-marketplace.
          # Leave unset to skip the pin — the release still succeeds, and plugin
          # users stay on whatever ref is currently pinned.
          GH_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "MARKETPLACE_TOKEN is not set — skipping the marketplace pin."
            echo "Plugin users remain on the previously pinned ref."
            exit 0
          fi
          python3 scripts/pin-marketplace.py "$GITHUB_REF_NAME"

  # VSCode extension is built separately — it does not go through goreleaser.
  build-extension:
    name: Build VSCode extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm install -g @vscode/vsce
      - run: vsce package --out avc-${{ github.ref_name }}.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: avc-extension
          path: extension/avc-${{ github.ref_name }}.vsix

  # Attach the .vsix to the release created by goreleaser above.
  attach-extension:
    name: Attach extension to release
    needs: [release, build-extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: avc-extension
          path: artifacts

      - name: Upload .vsix to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" artifacts/*.vsix \
            --repo "${{ github.repository }}" --clobber
