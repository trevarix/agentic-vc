name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  avc:
    name: AVC CLI on (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: avc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: avc/go.sum
      - run: go mod tidy
      - run: go build ./...
      - run: go vet ./...
      - name: Test
        env:
          CGO_ENABLED: "0"
        # The integration suite has grown substantially (Plans 01-04 added
        # ~100 tests) and Windows runners fsync SQLite WAL writes slowly —
        # give the suite real headroom rather than racing a tight budget.
        run: go test ./... -count=1 -timeout=600s

  extension:
    name: AVC Extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Compile
        run: npm run compile